[tools]
"aqua:gittower/git-flow-next" = "latest"
"aqua:JohnnyMorganz/StyLua" = "latest"

[tasks.verify]
description = "Check Lua formatting with stylua"
run = "stylua --check ."

[tasks.test]
description = "Check tabline labels for plain, diff, and mixed window layouts"
run = "nvim --headless '+luafile scripts/tabline-test.lua' +qa"

[tasks.test-diff]
description = "Check Diff resolvers, rendering, and commands"
run = "nvim --headless '+luafile scripts/diff-test.lua' +qa!"

[tasks.test-plenary]
description = "Run plenary unit specs in headless Neovim"
run = "nvim --headless -c 'PlenaryBustedDirectory tests/plenary/' -c 'qa!'"

[tasks.smoke]
description = "Load every plugin config module headless and fail on load errors"
run = """
status=0
nvim --headless '+luafile scripts/smoke.lua' +qa >"${TMPDIR:-/tmp}/nvim-smoke.log" 2>&1 || status=$?
cat "${TMPDIR:-/tmp}/nvim-smoke.log"
grep -qi "error" "${TMPDIR:-/tmp}/nvim-smoke.log" && exit 1
test "$status" -eq 0 || exit 1
echo "smoke passed"
"""
